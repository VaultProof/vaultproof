name = "zkvault"
main = "src/index.ts"
compatibility_date = "2026-03-27"
compatibility_flags = ["nodejs_compat"]

[vars]
ALLOWED_ORIGINS = "https://vaultproof.dev,https://www.vaultproof.dev"
ADMIN_EMAILS = "yee.nelsonk@gmail.com"

# KV namespace IDs will be filled after creation
# Run: wrangler kv namespace create CACHE
# Run: wrangler kv namespace create CACHE --preview
[[kv_namespaces]]
binding = "CACHE"
id = "1e925233c4f645fd8de5fd2a76c545d7"
preview_id = "fa6952ee46484691a16df77a8f15310b"

# ── Staging environment ──
[env.staging]
name = "vaultproof-staging"

[env.staging.vars]
ALLOWED_ORIGINS = "*"
ADMIN_EMAILS = "yee.nelsonk@gmail.com"

[[env.staging.kv_namespaces]]
binding = "CACHE"
id = "843558a2f8384166b9377c724281c113"
