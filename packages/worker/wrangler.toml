name = "zkvault"
main = "src/index.ts"
compatibility_date = "2026-03-27"
compatibility_flags = ["nodejs_compat"]

[vars]
ALLOWED_ORIGINS = "https://vaultproof.dev,https://www.vaultproof.dev"

# KV namespace IDs will be filled after creation
# Run: wrangler kv namespace create CACHE
# Run: wrangler kv namespace create CACHE --preview
[[kv_namespaces]]
binding = "CACHE"
id = "placeholder"
preview_id = "placeholder"
