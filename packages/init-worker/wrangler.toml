name = "vaultproof-init"
main = "src/index.ts"
compatibility_date = "2026-03-27"
compatibility_flags = ["nodejs_compat"]

[placement]
mode = "smart"

[vars]
ALLOWED_ORIGINS = "https://vaultproof.dev,https://www.vaultproof.dev"
# Set these at deploy time when enabling email alert delivery:
# RESEND_API_KEY = "<secret>"
# ALERTS_FROM_EMAIL = "alerts@vaultproof.dev"
# ALERTS_REPLY_TO_EMAIL = "support@vaultproof.dev"
# DEEPL_API_KEY = "<secret>"
# AUDIT_CHAIN_KEY_ID = "prod-2026-05"

# Set audit signing secrets with wrangler, not in this file:
#   wrangler secret put AUDIT_CHAIN_ED25519_PRIVATE_KEY_B64
# Optional fallback for private verification only:
#   wrangler secret put AUDIT_CHAIN_HMAC_KEY

# ── Durable Objects ──
# Strongly consistent rate limiting. Each DO instance is a singleton for
# its key (e.g. proxy:<project_id>), so counters are race-free.
[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RateLimiter"]

[triggers]
crons = ["*/30 * * * *"]

# ── Staging environment ──
[env.staging]
name = "vaultproof-init-staging"

[env.staging.vars]
ALLOWED_ORIGINS = "*"
# Optional staging email delivery config uses the same vars/secrets as production.

[[env.staging.durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiter"

[[env.staging.migrations]]
tag = "v1"
new_sqlite_classes = ["RateLimiter"]

[env.staging.triggers]
crons = ["*/30 * * * *"]
