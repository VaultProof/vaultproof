name = "vaultproof-init"
main = "src/index.ts"
compatibility_date = "2026-03-27"
compatibility_flags = ["nodejs_compat"]

[placement]
mode = "smart"

[vars]
ALLOWED_ORIGINS = "https://vaultproof.dev,https://www.vaultproof.dev"

# ── Durable Objects ──
# Strongly consistent rate limiting. Each DO instance is a singleton for
# its key (e.g. proxy:<project_id>), so counters are race-free.
[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RateLimiter"]

# ── Staging environment ──
[env.staging]
name = "vaultproof-init-staging"

[env.staging.vars]
ALLOWED_ORIGINS = "*"

[[env.staging.durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiter"

[[env.staging.migrations]]
tag = "v1"
new_sqlite_classes = ["RateLimiter"]
