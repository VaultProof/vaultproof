<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=350">
  <title>VaultProof</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 350px;
      min-height: 200px;
      max-height: 500px;
      background: #0a0a0f;
      color: #e2e2e8;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      overflow-y: auto;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo {
      font-size: 16px;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.3px;
    }

    .logo span {
      color: #6366f1;
    }

    .tier-badge {
      font-size: 10px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 10px;
      background: rgba(99, 102, 241, 0.15);
      color: #6366f1;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Login View */
    #loginView {
      display: none;
      padding: 40px 24px;
      text-align: center;
    }

    #loginView .lock-icon {
      font-size: 36px;
      margin-bottom: 16px;
      opacity: 0.6;
    }

    #loginView h2 {
      font-size: 15px;
      font-weight: 600;
      color: #fff;
      margin-bottom: 8px;
    }

    #loginView p {
      font-size: 12px;
      color: #888;
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .btn-primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 10px 16px;
      background: #6366f1;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn-primary:hover {
      background: #5558e6;
    }

    .btn-secondary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 10px 16px;
      background: transparent;
      color: #888;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-secondary:hover {
      color: #e2e2e8;
      border-color: rgba(255, 255, 255, 0.15);
    }

    /* Settings (API Key Input) */
    #settingsView {
      display: none;
      padding: 24px 16px;
    }

    #settingsView h3 {
      font-size: 13px;
      font-weight: 600;
      color: #fff;
      margin-bottom: 4px;
    }

    #settingsView p {
      font-size: 11px;
      color: #666;
      margin-bottom: 16px;
      line-height: 1.4;
    }

    /* Main View */
    #mainView {
      display: none;
    }

    .section {
      padding: 12px 16px;
    }

    .section-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #666;
      margin-bottom: 8px;
    }

    /* Key List */
    .key-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      background: #111118;
      border-radius: 10px;
      margin-bottom: 6px;
    }

    .key-provider {
      font-size: 11px;
      font-weight: 600;
      color: #6366f1;
      text-transform: uppercase;
      min-width: 70px;
    }

    .key-label {
      flex: 1;
      font-size: 12px;
      color: #ccc;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .key-id {
      font-size: 11px;
      color: #555;
      font-family: 'SF Mono', 'Fira Code', monospace;
    }

    .empty {
      text-align: center;
      padding: 20px;
      color: #555;
      font-size: 12px;
    }

    .error {
      text-align: center;
      padding: 12px;
      color: #f87171;
      font-size: 12px;
    }

    /* Store Form */
    .form-group {
      margin-bottom: 10px;
    }

    .form-group label {
      display: block;
      font-size: 11px;
      font-weight: 500;
      color: #888;
      margin-bottom: 4px;
    }

    .form-group select,
    .form-group input {
      width: 100%;
      padding: 8px 12px;
      background: #111118;
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 8px;
      color: #e2e2e8;
      font-size: 12px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s;
    }

    .form-group select:focus,
    .form-group input:focus {
      border-color: #6366f1;
    }

    .form-group select option {
      background: #111118;
      color: #e2e2e8;
    }

    .status {
      font-size: 11px;
      margin-top: 6px;
      min-height: 16px;
    }

    .status.success {
      color: #10b981;
    }

    .status.error {
      color: #f87171;
    }

    .divider {
      height: 1px;
      background: rgba(255, 255, 255, 0.06);
      margin: 0;
    }

    .footer {
      display: flex;
      gap: 8px;
      padding: 12px 16px;
    }

    .footer .btn-secondary {
      font-size: 11px;
      padding: 8px 12px;
    }

    #settingsStatus {
      font-size: 11px;
      margin-top: 6px;
      min-height: 16px;
      color: #f87171;
    }

    #settingsStatus.saved {
      color: #10b981;
    }

    .connect-apikey-link {
      display: block;
      text-align: center;
      margin-top: 16px;
      font-size: 11px;
      color: #6366f1;
      cursor: pointer;
      background: none;
      border: none;
      font-family: inherit;
    }

    .connect-apikey-link:hover {
      text-decoration: underline;
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 12px;
      font-size: 11px;
      color: #666;
      cursor: pointer;
      background: none;
      border: none;
      font-family: inherit;
    }

    .back-link:hover {
      color: #e2e2e8;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div class="header-left">
      <div class="logo">Vault<span>Proof</span></div>
    </div>
    <div class="tier-badge" id="tierBadge" style="display:none;"></div>
  </div>

  <!-- Login View -->
  <div id="loginView">
    <div style="padding: 32px 24px; text-align: center;">
      <div style="font-size: 36px; margin-bottom: 12px; opacity: 0.6;">&#128274;</div>
      <h2 style="font-size: 15px; font-weight: 600; color: #fff; margin-bottom: 8px;">Secure Your API Keys</h2>
      <p style="font-size: 12px; color: #888; margin-bottom: 20px; line-height: 1.5;">Store API keys with one click. No one can see them — not even us.</p>
      <button class="btn-primary" id="connectBtn">Sign in to VaultProof</button>
      <div id="apiKeyStep" style="display:none; margin-top: 16px;">
        <div style="height: 1px; background: rgba(255,255,255,0.06); margin: 0 0 16px;"></div>
        <p style="font-size: 12px; color: #fff; margin-bottom: 4px;">Signed in?</p>
        <p style="font-size: 11px; color: #888; margin-bottom: 8px;">Go to Settings → Developer Keys → paste it below:</p>
        <div class="form-group" style="margin-bottom: 8px;">
          <input type="password" id="vpKeyInput" placeholder="vp_live_..." spellcheck="false" autocomplete="off">
        </div>
        <button class="btn-primary" id="saveKeyBtn">Connect</button>
        <div id="settingsStatus" style="font-size: 11px; margin-top: 6px; min-height: 16px; color: #f87171;"></div>
      </div>
    </div>
  </div>

  <!-- Main View -->
  <div id="mainView">
    <!-- Stored Keys -->
    <div class="section">
      <div class="section-title">Stored Keys</div>
      <div id="keyList">
        <p class="empty">Loading...</p>
      </div>
    </div>

    <div class="divider"></div>

    <!-- Store New Key -->
    <div class="section">
      <div class="section-title">Store New Key</div>
      <div class="form-group">
        <label>Provider</label>
        <select id="provider">
          <option value="openai">OpenAI</option>
          <option value="anthropic">Anthropic</option>
          <option value="google">Google AI</option>
          <option value="groq">Groq</option>
          <option value="mistral">Mistral</option>
          <option value="together">Together AI</option>
          <option value="cohere">Cohere</option>
          <option value="perplexity">Perplexity</option>
          <option value="replicate">Replicate</option>
          <option value="fireworks">Fireworks</option>
          <option value="deepseek">DeepSeek</option>
        </select>
      </div>
      <div class="form-group">
        <label>API Key</label>
        <input type="password" id="apiKeyInput" placeholder="sk-..." spellcheck="false" autocomplete="off">
      </div>
      <div class="form-group">
        <label>Label (optional)</label>
        <input type="text" id="labelInput" placeholder="Production key">
      </div>
      <button class="btn-primary" id="storeBtn">Store Key</button>
      <div id="storeStatus" class="status"></div>
    </div>

    <div class="divider"></div>

    <!-- Footer -->
    <div class="footer">
      <button class="btn-secondary" id="dashboardBtn" style="flex:1;">Open Dashboard</button>
      <button class="btn-secondary" id="disconnectBtn" style="flex:1; color:#f87171; border-color:rgba(248,113,113,0.15);">Disconnect</button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
