name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build shamir (required before its tests run)
        run: npm run build --workspace=packages/shamir

      - name: Test shamir
        run: npm run test --workspace=packages/shamir

      - name: Type-check init-worker
        run: npx tsc --noEmit
        working-directory: packages/init-worker

      - name: Type-check init-cli
        run: npx tsc --noEmit
        working-directory: packages/init-cli

      - name: Unit tests — init-worker
        run: |
          npx tsx src/lib/ssrf-guard.test.ts
          npx tsx src/lib/rate-limit.test.ts
          npx tsx src/lib/project-auth.test.ts
          npx tsx src/lib/project-cache.test.ts
          npx tsx src/lib/audit-chain.test.ts
          npx tsx src/crypto/fast-crypt.test.ts
          npx tsx test/shamir-roundtrip.ts
        working-directory: packages/init-worker

      - name: Unit tests — init-cli
        run: |
          npx tsx src/providers.test.ts
          npx tsx src/login.test.ts
          npx tsx src/legacy.test.ts
          npx tsx src/rewrite.test.ts
          npm run build
          npx tsx src/publish.test.ts
        working-directory: packages/init-cli
