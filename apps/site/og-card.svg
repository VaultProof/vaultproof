<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="orb1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="blur1"><feGaussianBlur stdDeviation="80"/></filter>
    <filter id="blur2"><feGaussianBlur stdDeviation="100"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="2" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#0a0a0f"/>

  <!-- Subtle orbs -->
  <ellipse cx="180" cy="180" rx="400" ry="400" fill="url(#orb1)" filter="url(#blur1)"/>
  <ellipse cx="1050" cy="480" rx="320" ry="320" fill="url(#orb2)" filter="url(#blur2)"/>

  <!-- Grid lines -->
  <g stroke="#ffffff" stroke-opacity="0.025" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Shield icon -->
  <g transform="translate(560, 140)" filter="url(#glow)">
    <path d="M40 4 L76 18 V42 C76 62 60 78 40 84 C20 78 4 62 4 42 V18 Z" fill="none" stroke="url(#shield)" stroke-width="3" opacity="0.9"/>
    <path d="M30 36 L38 44 L52 30" fill="none" stroke="url(#shield)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Title -->
  <text x="600" y="290" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="700" fill="white" text-anchor="middle" letter-spacing="-2">VaultProof</text>

  <!-- Tagline -->
  <text x="600" y="345" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="400" fill="#94a3b8" text-anchor="middle">Secure API key storage with split-key encryption</text>

  <!-- Features -->
  <g font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#64748b" text-anchor="middle">
    <text x="320" y="430">Split-key encryption</text>
    <text x="600" y="430">Transparent proxy</text>
    <text x="880" y="430">Repo scanning</text>
  </g>

  <!-- Dots between features -->
  <circle cx="460" cy="425" r="2" fill="#4b5563"/>
  <circle cx="740" cy="425" r="2" fill="#4b5563"/>

  <!-- Bottom URL -->
  <text x="600" y="560" font-family="system-ui, -apple-system, sans-serif" font-size="20" fill="#4b5563" text-anchor="middle" letter-spacing="3">VAULTPROOF.DEV</text>
</svg>
