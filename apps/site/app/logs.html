<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Logs — VaultProof</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { geist: ['Geist', 'sans-serif'] },
          colors: { brand: '#6366f1', surface: '#0a0e1a', card: '#111827', border: '#1f2937' }
        }
      }
    };
  </script>
  <style>
    body { font-family: 'Geist', sans-serif; background: #0a0e1a; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #0a0e1a; }
    ::-webkit-scrollbar-thumb { background: #374151; border-radius: 3px; }
  </style>
</head>
<body class="text-gray-100 min-h-screen">

  <!-- Mobile Header -->
  <div class="lg:hidden fixed top-0 left-0 right-0 z-50 bg-surface border-b border-border px-4 py-3 flex items-center justify-between">
    <button id="menuBtn" class="text-gray-400 hover:text-white">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <span class="text-lg font-bold">VaultProof</span>
    <div class="w-6"></div>
  </div>

  <!-- Sidebar Overlay -->
  <div id="sidebarOverlay" class="fixed inset-0 bg-black/50 z-40 hidden lg:hidden" onclick="toggleSidebar()"></div>

  <!-- Sidebar -->
  <aside id="sidebar" class="fixed top-0 left-0 h-full w-60 bg-card border-r border-border z-50 flex flex-col transform -translate-x-full lg:translate-x-0 transition-transform duration-200">
    <div class="p-5 border-b border-border">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-lg bg-brand flex items-center justify-center">
          <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
        </div>
        <span class="text-lg font-bold">VaultProof</span>
      </div>
    </div>
    <nav class="flex-1 p-3 space-y-1">
      <a href="index.html" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-gray-400 hover:text-white hover:bg-white/5 text-sm transition">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zm10 0a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zm10 0a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/></svg>
        Overview
      </a>
      <a href="keys.html" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-gray-400 hover:text-white hover:bg-white/5 text-sm transition">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"/></svg>
        Keys
      </a>
      <a href="logs.html" class="flex items-center gap-3 px-3 py-2.5 rounded-xl bg-brand/20 text-brand font-medium text-sm">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
        Logs
      </a>
      <a href="settings.html" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-gray-400 hover:text-white hover:bg-white/5 text-sm transition">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.066 2.573c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.573 1.066c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.066-2.573c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
        Settings
      </a>
    </nav>
    <div class="p-4 border-t border-border">
      <div class="text-xs text-gray-500 truncate mb-2" id="sidebarEmail">—</div>
      <button onclick="logout()" class="flex items-center gap-2 text-sm text-gray-400 hover:text-red-400 transition">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
        Logout
      </button>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="lg:ml-60 pt-16 lg:pt-0 min-h-screen">
    <div class="max-w-7xl mx-auto p-6 lg:p-8 space-y-6">

      <!-- Header -->
      <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
        <div>
          <h1 class="text-2xl font-bold">Access Logs</h1>
          <p class="text-gray-500 text-sm mt-1">Track every API call routed through VaultProof</p>
        </div>
        <button onclick="exportCSV()" class="inline-flex items-center gap-2 px-4 py-2 bg-card border border-border rounded-xl text-sm text-gray-300 hover:text-white hover:border-gray-600 transition">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
          Export CSV
        </button>
      </div>

      <!-- Search & Filters -->
      <div class="bg-card border border-border rounded-2xl p-4 space-y-3">
        <div class="flex flex-col sm:flex-row gap-3">
          <div class="flex-1 relative">
            <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
            <input id="searchInput" type="text" placeholder="Search by app name or key label..." class="w-full pl-10 pr-4 py-2.5 bg-surface border border-border rounded-xl text-sm text-white placeholder-gray-500 focus:outline-none focus:border-brand transition" />
          </div>
        </div>
        <div class="flex flex-wrap gap-3">
          <select id="filterKey" class="bg-surface border border-border rounded-xl px-3 py-2 text-sm text-gray-300 focus:outline-none focus:border-brand">
            <option value="">All Keys</option>
          </select>
          <select id="filterStatus" class="bg-surface border border-border rounded-xl px-3 py-2 text-sm text-gray-300 focus:outline-none focus:border-brand">
            <option value="">All Status</option>
            <option value="success">Success</option>
            <option value="error">Error</option>
          </select>
          <select id="filterDate" class="bg-surface border border-border rounded-xl px-3 py-2 text-sm text-gray-300 focus:outline-none focus:border-brand">
            <option value="7">Last 7 days</option>
            <option value="30" selected>Last 30 days</option>
            <option value="all">All time</option>
          </select>
        </div>
      </div>

      <!-- Table -->
      <div class="bg-card border border-border rounded-2xl overflow-hidden">
        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead>
              <tr class="border-b border-border text-gray-500 text-left">
                <th class="px-5 py-3 font-medium">Timestamp</th>
                <th class="px-5 py-3 font-medium">Key</th>
                <th class="px-5 py-3 font-medium">App</th>
                <th class="px-5 py-3 font-medium">Endpoint</th>
                <th class="px-5 py-3 font-medium">Status</th>
                <th class="px-5 py-3 font-medium">Latency</th>
                <th class="px-5 py-3 font-medium">ZK Proof</th>
              </tr>
            </thead>
            <tbody id="logsBody">
              <tr><td colspan="7" class="px-5 py-12 text-center text-gray-600">
                <div class="flex flex-col items-center gap-2">
                  <div class="h-6 w-6 border-2 border-brand border-t-transparent rounded-full animate-spin"></div>
                  <span>Loading logs...</span>
                </div>
              </td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- Pagination -->
      <div class="flex items-center justify-between" id="paginationWrap" style="display: none;">
        <div class="text-sm text-gray-500" id="paginationInfo">—</div>
        <div class="flex gap-2">
          <button id="prevBtn" onclick="changePage(-1)" class="px-3 py-1.5 bg-card border border-border rounded-lg text-sm text-gray-400 hover:text-white hover:border-gray-600 transition disabled:opacity-30 disabled:cursor-not-allowed">Previous</button>
          <button id="nextBtn" onclick="changePage(1)" class="px-3 py-1.5 bg-card border border-border rounded-lg text-sm text-gray-400 hover:text-white hover:border-gray-600 transition disabled:opacity-30 disabled:cursor-not-allowed">Next</button>
        </div>
      </div>

    </div>
  </main>

  <script>
    const API = 'https://api.vaultproof.dev/api/v1';
    const token = localStorage.getItem('vaultproof_token');
    const user = JSON.parse(localStorage.getItem('vaultproof_user') || '{}');

    if (!token) { window.location.href = 'login.html'; }

    const sidebarEl = document.getElementById('sidebar');
    const overlayEl = document.getElementById('sidebarOverlay');
    document.getElementById('sidebarEmail').textContent = user.email || '—';
    document.getElementById('menuBtn').addEventListener('click', toggleSidebar);

    function toggleSidebar() {
      sidebarEl.classList.toggle('-translate-x-full');
      overlayEl.classList.toggle('hidden');
    }

    function logout() {
      localStorage.removeItem('vaultproof_token');
      localStorage.removeItem('vaultproof_user');
      window.location.href = 'login.html';
    }

    async function apiFetch(path) {
      const res = await fetch(`${API}${path}`, {
        headers: { 'Authorization': `Bearer ${token}` }
      });
      if (res.status === 401) { window.location.href = 'login.html'; return null; }
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      return res.json();
    }

    function formatTime(ts) {
      if (!ts) return '—';
      const d = new Date(ts);
      return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) + ' ' +
             d.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    }

    function providerBadge(provider) {
      const colors = {
        openai: 'bg-green-900/50 text-green-400 border-green-800',
        anthropic: 'bg-orange-900/50 text-orange-400 border-orange-800',
        google: 'bg-blue-900/50 text-blue-400 border-blue-800',
        together: 'bg-purple-900/50 text-purple-400 border-purple-800'
      };
      const c = colors[(provider || '').toLowerCase()] || 'bg-gray-800 text-gray-400 border-gray-700';
      return `<span class="inline-flex items-center px-2 py-0.5 rounded-md text-xs font-medium border ${c}">${provider || 'Unknown'}</span>`;
    }

    function statusBadge(status) {
      if ((status || '').toLowerCase() === 'success' || (status || '').toLowerCase() === 'ok' || status === 200 || status === '200') {
        return '<span class="inline-flex items-center px-2 py-0.5 rounded-md text-xs font-medium bg-green-900/50 text-green-400 border border-green-800">Success</span>';
      }
      return '<span class="inline-flex items-center px-2 py-0.5 rounded-md text-xs font-medium bg-red-900/50 text-red-400 border border-red-800">Error</span>';
    }

    function zkBadge(verified) {
      if (verified) {
        return '<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-md text-xs font-medium bg-brand/20 text-brand border border-indigo-800"><svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>Verified</span>';
      }
      return '<span class="text-gray-600 text-xs">—</span>';
    }

    let allLogs = [];
    let allKeys = [];
    let currentPage = 1;
    const PAGE_SIZE = 25;

    function getFilteredLogs() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const keyFilter = document.getElementById('filterKey').value;
      const statusFilter = document.getElementById('filterStatus').value;
      const dateFilter = document.getElementById('filterDate').value;

      let logs = [...allLogs];

      if (search) {
        logs = logs.filter(l =>
          (l.appName || '').toLowerCase().includes(search) ||
          (l.keyLabel || '').toLowerCase().includes(search)
        );
      }

      if (keyFilter) {
        logs = logs.filter(l => l.keySlotId === keyFilter || l.keyLabel === keyFilter);
      }

      if (statusFilter) {
        logs = logs.filter(l => {
          const s = (l.status || '').toString().toLowerCase();
          if (statusFilter === 'success') return s === 'success' || s === 'ok' || s === '200';
          return s !== 'success' && s !== 'ok' && s !== '200';
        });
      }

      if (dateFilter !== 'all') {
        const days = parseInt(dateFilter);
        const cutoff = Date.now() - (days * 24 * 60 * 60 * 1000);
        logs = logs.filter(l => new Date(l.timestamp).getTime() >= cutoff);
      }

      return logs;
    }

    function renderLogs() {
      const filtered = getFilteredLogs();
      const totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
      if (currentPage > totalPages) currentPage = totalPages;

      const start = (currentPage - 1) * PAGE_SIZE;
      const page = filtered.slice(start, start + PAGE_SIZE);

      const tbody = document.getElementById('logsBody');
      if (page.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" class="px-5 py-12 text-center text-gray-600">No logs match your filters</td></tr>';
      } else {
        tbody.innerHTML = page.map(l => `
          <tr class="border-b border-border/50 hover:bg-white/[0.02] transition">
            <td class="px-5 py-3 text-gray-400 whitespace-nowrap text-xs">${formatTime(l.timestamp)}</td>
            <td class="px-5 py-3 whitespace-nowrap">
              <div class="flex items-center gap-2">
                ${providerBadge(l.provider)}
                <span class="text-gray-300 text-xs">${l.keyLabel || '—'}</span>
              </div>
            </td>
            <td class="px-5 py-3 text-gray-300 whitespace-nowrap">${l.appName || '—'}</td>
            <td class="px-5 py-3 text-gray-400 whitespace-nowrap font-mono text-xs">${l.endpoint || '—'}</td>
            <td class="px-5 py-3 whitespace-nowrap">${statusBadge(l.status)}</td>
            <td class="px-5 py-3 text-gray-400 whitespace-nowrap">${l.latency != null ? l.latency + 'ms' : '—'}</td>
            <td class="px-5 py-3 whitespace-nowrap">${zkBadge(l.zkProofVerified)}</td>
          </tr>
        `).join('');
      }

      // Pagination
      const wrap = document.getElementById('paginationWrap');
      wrap.style.display = filtered.length > 0 ? 'flex' : 'none';
      document.getElementById('paginationInfo').textContent = `Showing ${start + 1}–${Math.min(start + PAGE_SIZE, filtered.length)} of ${filtered.length} logs`;
      document.getElementById('prevBtn').disabled = currentPage <= 1;
      document.getElementById('nextBtn').disabled = currentPage >= totalPages;
    }

    function changePage(delta) {
      currentPage += delta;
      renderLogs();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Event listeners
    document.getElementById('searchInput').addEventListener('input', () => { currentPage = 1; renderLogs(); });
    document.getElementById('filterKey').addEventListener('change', () => { currentPage = 1; renderLogs(); });
    document.getElementById('filterStatus').addEventListener('change', () => { currentPage = 1; renderLogs(); });
    document.getElementById('filterDate').addEventListener('change', () => { currentPage = 1; renderLogs(); });

    function exportCSV() {
      const filtered = getFilteredLogs();
      if (filtered.length === 0) { alert('No logs to export.'); return; }

      const headers = ['Timestamp', 'Provider', 'Key Label', 'App', 'Endpoint', 'Status', 'Latency (ms)', 'ZK Proof Verified'];
      const rows = filtered.map(l => [
        l.timestamp || '',
        l.provider || '',
        l.keyLabel || '',
        l.appName || '',
        l.endpoint || '',
        l.status || '',
        l.latency != null ? l.latency : '',
        l.zkProofVerified ? 'Yes' : 'No'
      ]);

      const csv = [headers, ...rows].map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(',')).join('\n');
      const blob = new Blob([csv], { type: 'text/csv' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `vaultproof-logs-${new Date().toISOString().slice(0, 10)}.csv`;
      a.click();
      URL.revokeObjectURL(url);
    }

    async function loadLogs() {
      try {
        const keysData = await apiFetch('/stats/by-key');
        if (!keysData || !keysData.keys) {
          document.getElementById('logsBody').innerHTML = '<tr><td colspan="7" class="px-5 py-12 text-center text-gray-600">No keys found</td></tr>';
          return;
        }

        allKeys = keysData.keys;

        // Populate key filter dropdown
        const filterKey = document.getElementById('filterKey');
        allKeys.forEach(k => {
          const opt = document.createElement('option');
          opt.value = k.id || k.keySlotId || k.label;
          opt.textContent = `${k.provider ? k.provider + ' — ' : ''}${k.label || 'Unnamed'}`;
          filterKey.appendChild(opt);
        });

        // Fetch logs for each key in parallel
        const logPromises = allKeys.map(async (k) => {
          const keyId = k.id || k.keySlotId;
          if (!keyId) return [];
          try {
            const data = await apiFetch(`/keys/${keyId}/logs`);
            const logs = Array.isArray(data) ? data : (data && data.logs ? data.logs : []);
            return logs.map(l => ({
              ...l,
              keyLabel: l.keyLabel || k.label,
              provider: l.provider || k.provider,
              keySlotId: keyId
            }));
          } catch (e) {
            console.warn(`Failed to fetch logs for key ${keyId}:`, e);
            return [];
          }
        });

        const results = await Promise.all(logPromises);
        allLogs = results.flat().sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
        currentPage = 1;
        renderLogs();
      } catch (e) {
        console.error('Failed to load logs:', e);
        document.getElementById('logsBody').innerHTML = '<tr><td colspan="7" class="px-5 py-12 text-center text-gray-600">Failed to load logs</td></tr>';
      }
    }

    loadLogs();
  </script>
</body>
</html>
