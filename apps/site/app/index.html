<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Overview — VaultProof</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { geist: ['Geist', 'sans-serif'] },
          colors: { brand: '#6366f1', surface: '#0a0e1a', card: '#111827', border: '#1f2937' }
        }
      }
    };
  </script>
  <style>
    body { font-family: 'Geist', sans-serif; background: #0a0e1a; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #0a0e1a; }
    ::-webkit-scrollbar-thumb { background: #374151; border-radius: 3px; }
  </style>
</head>
<body class="text-gray-100 min-h-screen">

  <!-- Mobile Header -->
  <div class="lg:hidden fixed top-0 left-0 right-0 z-50 bg-surface border-b border-border px-4 py-3 flex items-center justify-between">
    <button id="menuBtn" class="text-gray-400 hover:text-white">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <span class="text-lg font-bold">VaultProof</span>
    <div class="w-6"></div>
  </div>

  <!-- Sidebar Overlay -->
  <div id="sidebarOverlay" class="fixed inset-0 bg-black/50 z-40 hidden lg:hidden" onclick="toggleSidebar()"></div>

  <!-- Sidebar -->
  <aside id="sidebar" class="fixed top-0 left-0 h-full w-60 bg-card border-r border-border z-50 flex flex-col transform -translate-x-full lg:translate-x-0 transition-transform duration-200">
    <div class="p-5 border-b border-border">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-lg bg-brand flex items-center justify-center">
          <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
        </div>
        <span class="text-lg font-bold">VaultProof</span>
      </div>
    </div>
    <nav class="flex-1 p-3 space-y-1">
      <a href="index.html" class="flex items-center gap-3 px-3 py-2.5 rounded-xl bg-brand/20 text-brand font-medium text-sm">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zm10 0a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zm10 0a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/></svg>
        Overview
      </a>
      <a href="keys.html" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-gray-400 hover:text-white hover:bg-white/5 text-sm transition">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"/></svg>
        Keys
      </a>
      <a href="logs.html" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-gray-400 hover:text-white hover:bg-white/5 text-sm transition">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
        Logs
      </a>
      <a href="settings.html" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-gray-400 hover:text-white hover:bg-white/5 text-sm transition">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.066 2.573c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.573 1.066c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.066-2.573c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
        Settings
      </a>
    </nav>
    <div class="p-4 border-t border-border">
      <div class="text-xs text-gray-500 truncate mb-2" id="sidebarEmail">—</div>
      <button onclick="logout()" class="flex items-center gap-2 text-sm text-gray-400 hover:text-red-400 transition">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
        Logout
      </button>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="lg:ml-60 pt-16 lg:pt-0 min-h-screen">
    <div class="max-w-7xl mx-auto p-6 lg:p-8 space-y-8">

      <!-- Header -->
      <div>
        <h1 class="text-2xl font-bold">Overview</h1>
        <p class="text-gray-500 text-sm mt-1">Monitor your API key usage and activity</p>
      </div>

      <!-- Stats Cards -->
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4" id="statsGrid">
        <div class="bg-card border border-border rounded-2xl p-5">
          <div class="text-sm text-gray-500 mb-1">Total Keys</div>
          <div class="text-3xl font-bold" id="statKeys">
            <div class="h-8 w-16 bg-gray-800 rounded animate-pulse"></div>
          </div>
        </div>
        <div class="bg-card border border-border rounded-2xl p-5">
          <div class="text-sm text-gray-500 mb-1">API Calls (month)</div>
          <div class="text-3xl font-bold" id="statCalls">
            <div class="h-8 w-16 bg-gray-800 rounded animate-pulse"></div>
          </div>
        </div>
        <div class="bg-card border border-border rounded-2xl p-5">
          <div class="text-sm text-gray-500 mb-1">Active Apps</div>
          <div class="text-3xl font-bold" id="statApps">
            <div class="h-8 w-16 bg-gray-800 rounded animate-pulse"></div>
          </div>
        </div>
        <div class="bg-card border border-border rounded-2xl p-5">
          <div class="text-sm text-gray-500 mb-1">Error Rate</div>
          <div class="text-3xl font-bold" id="statErrors">
            <div class="h-8 w-16 bg-gray-800 rounded animate-pulse"></div>
          </div>
        </div>
      </div>

      <!-- Usage Chart -->
      <div class="bg-card border border-border rounded-2xl p-6">
        <h2 class="text-lg font-semibold mb-4">API Calls — Last 30 Days</h2>
        <div class="relative" style="height: 260px;">
          <canvas id="usageChart" class="w-full h-full"></canvas>
          <div id="chartLoading" class="absolute inset-0 flex items-center justify-center">
            <div class="h-6 w-6 border-2 border-brand border-t-transparent rounded-full animate-spin"></div>
          </div>
        </div>
      </div>

      <!-- Key Health -->
      <div>
        <h2 class="text-lg font-semibold mb-4">Key Health</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4" id="keyHealthGrid">
          <div class="bg-card border border-border rounded-2xl p-5 animate-pulse">
            <div class="h-4 w-32 bg-gray-800 rounded mb-3"></div>
            <div class="h-3 w-24 bg-gray-800 rounded"></div>
          </div>
        </div>
      </div>

      <!-- Recent Activity -->
      <div>
        <h2 class="text-lg font-semibold mb-4">Recent Activity</h2>
        <div class="bg-card border border-border rounded-2xl overflow-hidden">
          <div class="overflow-x-auto">
            <table class="w-full text-sm">
              <thead>
                <tr class="border-b border-border text-gray-500 text-left">
                  <th class="px-5 py-3 font-medium">Timestamp</th>
                  <th class="px-5 py-3 font-medium">Action</th>
                  <th class="px-5 py-3 font-medium">App</th>
                  <th class="px-5 py-3 font-medium">Key</th>
                </tr>
              </thead>
              <tbody id="activityBody">
                <tr><td colspan="4" class="px-5 py-8 text-center text-gray-600">Loading...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

    </div>
  </main>

  <script>
    const API = 'https://api.vaultproof.dev/api/v1';
    const token = localStorage.getItem('vaultproof_token');
    const user = JSON.parse(localStorage.getItem('vaultproof_user') || '{}');

    if (!token) { window.location.href = 'login.html'; }

    // Sidebar
    const sidebarEl = document.getElementById('sidebar');
    const overlayEl = document.getElementById('sidebarOverlay');
    document.getElementById('sidebarEmail').textContent = user.email || '—';
    document.getElementById('menuBtn').addEventListener('click', toggleSidebar);

    function toggleSidebar() {
      sidebarEl.classList.toggle('-translate-x-full');
      overlayEl.classList.toggle('hidden');
    }

    function logout() {
      localStorage.removeItem('vaultproof_token');
      localStorage.removeItem('vaultproof_user');
      window.location.href = 'login.html';
    }

    async function apiFetch(path) {
      const res = await fetch(`${API}${path}`, {
        headers: { 'Authorization': `Bearer ${token}` }
      });
      if (res.status === 401) { window.location.href = 'login.html'; return null; }
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      return res.json();
    }

    function formatTime(ts) {
      if (!ts) return '—';
      const d = new Date(ts);
      return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) + ' ' +
             d.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
    }

    function providerBadge(provider) {
      const colors = {
        openai: 'bg-green-900/50 text-green-400 border-green-800',
        anthropic: 'bg-orange-900/50 text-orange-400 border-orange-800',
        google: 'bg-blue-900/50 text-blue-400 border-blue-800',
        together: 'bg-purple-900/50 text-purple-400 border-purple-800'
      };
      const c = colors[(provider || '').toLowerCase()] || 'bg-gray-800 text-gray-400 border-gray-700';
      return `<span class="inline-flex items-center px-2 py-0.5 rounded-md text-xs font-medium border ${c}">${provider || 'Unknown'}</span>`;
    }

    // Load overview stats
    async function loadOverview() {
      try {
        const data = await apiFetch('/stats/overview');
        if (!data) return;
        document.getElementById('statKeys').textContent = data.totalKeys ?? 0;
        document.getElementById('statCalls').textContent = (data.apiCalls ?? 0).toLocaleString();
        document.getElementById('statApps').textContent = data.activeApps ?? 0;
        document.getElementById('statErrors').textContent = (data.errorRate ?? 0).toFixed(1) + '%';

        // Recent Activity
        const activity = data.recentActivity || [];
        const tbody = document.getElementById('activityBody');
        if (activity.length === 0) {
          tbody.innerHTML = '<tr><td colspan="4" class="px-5 py-8 text-center text-gray-600">No recent activity</td></tr>';
        } else {
          tbody.innerHTML = activity.slice(0, 10).map(a => `
            <tr class="border-b border-border/50 hover:bg-white/[0.02] transition">
              <td class="px-5 py-3 text-gray-400 whitespace-nowrap">${formatTime(a.timestamp)}</td>
              <td class="px-5 py-3 whitespace-nowrap">${a.action || '—'}</td>
              <td class="px-5 py-3 text-gray-400 whitespace-nowrap">${a.appName || '—'}</td>
              <td class="px-5 py-3 whitespace-nowrap">${a.keyLabel || '—'}</td>
            </tr>
          `).join('');
        }
      } catch (e) {
        console.error('Failed to load overview:', e);
        document.getElementById('statKeys').textContent = '—';
        document.getElementById('statCalls').textContent = '—';
        document.getElementById('statApps').textContent = '—';
        document.getElementById('statErrors').textContent = '—';
      }
    }

    // Load usage chart
    async function loadUsageChart() {
      try {
        const data = await apiFetch('/stats/usage?days=30');
        document.getElementById('chartLoading').classList.add('hidden');
        if (!data || !data.days || data.days.length === 0) return;

        const canvas = document.getElementById('usageChart');
        const ctx = canvas.getContext('2d');
        const dpr = window.devicePixelRatio || 1;
        const rect = canvas.parentElement.getBoundingClientRect();
        canvas.width = rect.width * dpr;
        canvas.height = rect.height * dpr;
        canvas.style.width = rect.width + 'px';
        canvas.style.height = rect.height + 'px';
        ctx.scale(dpr, dpr);

        const W = rect.width;
        const H = rect.height;
        const padL = 50, padR = 20, padT = 10, padB = 40;
        const chartW = W - padL - padR;
        const chartH = H - padT - padB;

        const days = data.days;
        const values = days.map(d => d.calls || 0);
        const maxVal = Math.max(...values, 1);
        const barW = Math.max(2, (chartW / days.length) - 2);

        // Grid lines
        ctx.strokeStyle = '#1f2937';
        ctx.lineWidth = 1;
        for (let i = 0; i <= 4; i++) {
          const y = padT + (chartH / 4) * i;
          ctx.beginPath();
          ctx.moveTo(padL, y);
          ctx.lineTo(W - padR, y);
          ctx.stroke();

          ctx.fillStyle = '#6b7280';
          ctx.font = '11px Geist, sans-serif';
          ctx.textAlign = 'right';
          ctx.fillText(Math.round(maxVal - (maxVal / 4) * i), padL - 8, y + 4);
        }

        // Bars
        days.forEach((d, i) => {
          const x = padL + (chartW / days.length) * i + 1;
          const barH = (values[i] / maxVal) * chartH;
          const y = padT + chartH - barH;

          const gradient = ctx.createLinearGradient(x, y, x, padT + chartH);
          gradient.addColorStop(0, '#6366f1');
          gradient.addColorStop(1, '#4338ca');
          ctx.fillStyle = gradient;
          ctx.beginPath();
          ctx.roundRect(x, y, barW, barH, [3, 3, 0, 0]);
          ctx.fill();

          // X-axis labels (every 5 days)
          if (i % 5 === 0 || i === days.length - 1) {
            ctx.fillStyle = '#6b7280';
            ctx.font = '10px Geist, sans-serif';
            ctx.textAlign = 'center';
            const label = new Date(d.date).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
            ctx.fillText(label, x + barW / 2, H - 8);
          }
        });
      } catch (e) {
        console.error('Failed to load usage chart:', e);
        document.getElementById('chartLoading').innerHTML = '<span class="text-gray-600 text-sm">Failed to load chart</span>';
      }
    }

    // Load key health
    async function loadKeyHealth() {
      try {
        const data = await apiFetch('/stats/by-key');
        const grid = document.getElementById('keyHealthGrid');
        if (!data || !data.keys || data.keys.length === 0) {
          grid.innerHTML = '<div class="col-span-full text-center text-gray-600 py-8">No keys found. <a href="keys.html" class="text-brand hover:underline">Add your first key</a></div>';
          return;
        }
        grid.innerHTML = data.keys.map(k => `
          <div class="bg-card border border-border rounded-2xl p-5 hover:border-gray-700 transition">
            <div class="flex items-center justify-between mb-3">
              <span class="font-medium text-sm truncate">${k.label || 'Unnamed Key'}</span>
              ${providerBadge(k.provider)}
            </div>
            <div class="grid grid-cols-3 gap-3 text-center">
              <div>
                <div class="text-lg font-bold">${(k.callsThisMonth || 0).toLocaleString()}</div>
                <div class="text-xs text-gray-500">Calls</div>
              </div>
              <div>
                <div class="text-lg font-bold ${(k.errors || 0) > 0 ? 'text-red-400' : ''}">${k.errors || 0}</div>
                <div class="text-xs text-gray-500">Errors</div>
              </div>
              <div>
                <div class="text-xs text-gray-400 mt-1">${k.lastUsed ? formatTime(k.lastUsed) : 'Never'}</div>
                <div class="text-xs text-gray-500">Last used</div>
              </div>
            </div>
          </div>
        `).join('');
      } catch (e) {
        console.error('Failed to load key health:', e);
        document.getElementById('keyHealthGrid').innerHTML = '<div class="col-span-full text-center text-gray-600 py-8">Failed to load key health data</div>';
      }
    }

    // Init
    loadOverview();
    loadUsageChart();
    loadKeyHealth();
  </script>
</body>
</html>
