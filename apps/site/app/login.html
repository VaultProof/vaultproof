<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="/favicon.png">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | VaultProof</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace']
          },
          colors: {
            brand: '#6366f1',
            'brand-hover': '#5558e6',
            cyan: '#06b6d4',
            surface: '#0a0a0f',
            card: '#111118',
            border: '#1e1e2e'
          }
        }
      }
    };
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: #0a0a0f; margin: 0; }

    /* Animated gradient orbs */
    @keyframes drift1 {
      0%   { transform: translate(0, 0) scale(1); }
      25%  { transform: translate(60px, -40px) scale(1.1); }
      50%  { transform: translate(-30px, 50px) scale(0.95); }
      75%  { transform: translate(-60px, -20px) scale(1.05); }
      100% { transform: translate(0, 0) scale(1); }
    }
    @keyframes drift2 {
      0%   { transform: translate(0, 0) scale(1); }
      25%  { transform: translate(-50px, 30px) scale(1.08); }
      50%  { transform: translate(40px, -60px) scale(0.92); }
      75%  { transform: translate(30px, 40px) scale(1.05); }
      100% { transform: translate(0, 0) scale(1); }
    }
    .orb-1 {
      position: fixed;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(99,102,241,0.15) 0%, transparent 70%);
      top: -100px;
      right: -100px;
      animation: drift1 20s ease-in-out infinite;
      pointer-events: none;
      z-index: 0;
    }
    .orb-2 {
      position: fixed;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(99,102,241,0.12) 0%, transparent 70%);
      bottom: -80px;
      left: -80px;
      animation: drift2 25s ease-in-out infinite;
      pointer-events: none;
      z-index: 0;
    }

    .btn-glow {
      box-shadow: 0 0 20px rgba(99,102,241,0.3);
    }
    .btn-glow:hover {
      box-shadow: 0 0 30px rgba(99,102,241,0.4);
    }
  </style>
</head>
<body class="min-h-screen text-gray-200 flex items-center justify-center">

  <!-- Animated orbs -->
  <div class="orb-1"></div>
  <div class="orb-2"></div>

  <div class="w-full max-w-md px-6 relative z-10">

    <!-- Header -->
    <div class="text-center mb-8">
      <a href="/" class="text-2xl font-bold text-white tracking-tight hover:text-indigo-400 transition" style="font-family:'Space Grotesk',sans-serif">VaultProof</a>
      <p class="text-sm text-gray-500 mt-1">Zero-knowledge API key infrastructure</p>
    </div>

    <!-- Promo code entry -->
    <div class="mb-4 text-center" style="max-width:400px;margin:0 auto">
      <button type="button" onclick="document.getElementById('promoRow').classList.toggle('hidden')" class="text-xs text-indigo-400 hover:text-indigo-300 transition">Have a promo code?</button>
      <div id="promoRow" class="hidden mt-2 flex gap-2">
        <input id="promoCodeInput" type="text" placeholder="Enter code" maxlength="50"
          class="flex-1 bg-[#111118] border border-[#1e1e2e] rounded-md px-3 py-2 text-sm text-gray-300 font-mono uppercase focus:border-indigo-500 focus:outline-none placeholder-gray-600"
          onkeydown="if(event.key==='Enter') applyPromoCode()" />
        <button type="button" onclick="applyPromoCode()" class="px-4 py-2 bg-[#1e1e2e] hover:bg-[#2a2a3a] text-gray-300 hover:text-white rounded-md text-sm font-medium transition">Apply</button>
      </div>
      <p id="promoCodeMsg" class="text-xs mt-1.5 hidden"></p>
    </div>

    <!-- Card -->
    <div class="bg-card border border-border rounded-lg p-6">

      <!-- Error display -->
      <div id="authError" class="hidden p-3 bg-amber-500/10 border border-amber-500/30 rounded-md text-sm text-amber-400 mb-4"></div>

      <!-- GitHub OAuth button (primary) -->
      <button onclick="loginWithGitHub()" class="w-full flex items-center justify-center gap-3 bg-brand hover:bg-brand-hover text-white py-3 rounded-md font-medium text-sm transition-all duration-200 btn-glow mb-3">
        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>
        Continue with GitHub
      </button>

      <!-- Google OAuth button -->
      <button onclick="loginWithGoogle()" class="w-full flex items-center justify-center gap-3 bg-transparent border border-[#1e1e2e] hover:border-gray-500 text-gray-300 py-3 rounded-md font-medium text-sm transition-all duration-200 mb-6">
        <svg class="w-5 h-5" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
        Continue with Google
      </button>

      <!-- Divider -->
      <div class="relative mb-5">
        <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-[#1e1e2e]"></div></div>
        <div class="relative flex justify-center">
          <span class="bg-card px-3 text-xs text-gray-500">Or sign in with email</span>
        </div>
      </div>

      <!-- Email/password section (always visible) -->
      <div id="emailSection">

        <!-- Tab Toggle -->
        <div class="flex bg-[#0a0a0f] rounded-md p-1 mb-6" style="position:relative;z-index:20;">
          <button type="button" id="loginTab" onclick="showTab('login')" class="flex-1 py-2.5 text-sm font-medium rounded-md bg-brand text-white transition-all duration-200 cursor-pointer">Login</button>
          <button type="button" id="registerTab" onclick="showTab('register')" class="flex-1 py-2.5 text-sm font-medium rounded-md text-gray-400 hover:text-gray-300 transition-all duration-200 cursor-pointer">Register</button>
        </div>

        <!-- Login Form -->
        <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
          <div>
            <label class="block text-sm text-gray-400 mb-1.5">Email</label>
            <input type="email" id="loginEmail" required class="w-full bg-[#111118] border border-[#1e1e2e] rounded-md px-4 py-2.5 text-sm text-white placeholder-gray-600 focus:border-[#6366f1] focus:outline-none transition" placeholder="you@example.com" />
          </div>
          <div>
            <label class="block text-sm text-gray-400 mb-1.5">Password</label>
            <input type="password" id="loginPassword" required class="w-full bg-[#111118] border border-[#1e1e2e] rounded-md px-4 py-2.5 text-sm text-white placeholder-gray-600 focus:border-[#6366f1] focus:outline-none transition" placeholder="Enter your password" />
          </div>
          <div class="text-right mt-1">
            <button type="button" onclick="showResetForm()" class="text-xs text-indigo-400 hover:underline">Forgot password?</button>
          </div>
          <div id="loginError" class="hidden p-3 bg-amber-500/10 border border-amber-500/30 rounded-md text-sm text-amber-400"></div>
          <button type="submit" id="loginBtn" class="w-full bg-brand hover:bg-brand-hover text-white py-2.5 rounded-md font-medium text-sm transition-all duration-200 btn-glow">Login</button>
        </form>

        <!-- Password Reset Form -->
        <div id="resetForm" class="hidden space-y-4">
          <p class="text-sm text-gray-400">Enter your email and we'll send a reset link.</p>
          <div>
            <label class="block text-sm text-gray-400 mb-1.5">Email</label>
            <input type="email" id="resetEmail" required class="w-full bg-[#111118] border border-[#1e1e2e] rounded-md px-4 py-2.5 text-sm text-white placeholder-gray-600 focus:border-[#6366f1] focus:outline-none transition" placeholder="you@example.com" />
          </div>
          <div id="resetStatus" class="hidden p-3 rounded-md text-sm"></div>
          <button type="button" onclick="handleReset()" id="resetBtn" class="w-full bg-brand hover:bg-brand-hover text-white py-2.5 rounded-md font-medium text-sm transition-all duration-200 btn-glow">Send Reset Link</button>
          <button type="button" onclick="hideResetForm()" class="w-full text-xs text-gray-500 hover:text-gray-400 mt-2">Back to login</button>
        </div>

        <!-- Register Form -->
        <form id="registerForm" class="hidden space-y-4" onsubmit="handleRegister(event)">
          <div>
            <label class="block text-sm text-gray-400 mb-1.5">Email</label>
            <input type="email" id="regEmail" required class="w-full bg-[#111118] border border-[#1e1e2e] rounded-md px-4 py-2.5 text-sm text-white placeholder-gray-600 focus:border-[#6366f1] focus:outline-none transition" placeholder="you@example.com" />
          </div>
          <div>
            <label class="block text-sm text-gray-400 mb-1.5">Password</label>
            <input type="password" id="regPassword" required minlength="8" class="w-full bg-[#111118] border border-[#1e1e2e] rounded-md px-4 py-2.5 text-sm text-white placeholder-gray-600 focus:border-[#6366f1] focus:outline-none transition" placeholder="Min 8 characters" />
          </div>
          <div id="regError" class="hidden p-3 bg-amber-500/10 border border-amber-500/30 rounded-md text-sm text-amber-400"></div>
          <button type="submit" id="regBtn" class="w-full bg-brand hover:bg-brand-hover text-white py-2.5 rounded-md font-medium text-sm transition-all duration-200 btn-glow">Create Account</button>
        </form>
      </div>

      <!-- Legal consent -->
      <p class="text-xs text-gray-500 mt-5 text-center">By signing up, you agree to our <a href="/terms" class="text-indigo-400 hover:underline">Terms of Service</a> and <a href="/privacy" class="text-indigo-400 hover:underline">Privacy Policy</a>.</p>
    </div>

    <!-- Back link -->
    <p class="text-center text-xs text-gray-600 mt-6">
      <a href="/" class="hover:text-gray-400 transition">&larr; Back to VaultProof</a>
    </p>
  </div>

  <script>
    // ── Supabase client ──
    const sbClient = window.supabase.createClient(
      'https://gwzkjiomemjlhtrdrlan.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd3emtqaW9tZW1qbGh0cmRybGFuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQzNDM3ODIsImV4cCI6MjA4OTkxOTc4Mn0.tgHUvpBvFiojetuqIP0sKb0iBNbKDJHdeo9n3Tofa3o'
    );

    // ── Loop detection (timestamp-based) ──
    let isRedirecting = false;
    const loopKey = 'vp_login_ts';
    const now = Date.now();
    const loopHistory = JSON.parse(sessionStorage.getItem(loopKey) || '[]').filter(function(t) { return now - t < 5000; });
    if (loopHistory.length >= 3) {
      // 3+ redirects in 5 seconds = loop. Break it.
      sessionStorage.removeItem(loopKey);
      localStorage.removeItem('vaultproof_token');
      localStorage.removeItem('vaultproof_user');
      localStorage.removeItem('vp_promo');
      sbClient.auth.signOut().catch(function() {});
      console.warn('Login loop detected — cleared auth state');
    }

    function safeRedirect(url) {
      if (isRedirecting) return;
      isRedirecting = true;
      loopHistory.push(Date.now());
      sessionStorage.setItem(loopKey, JSON.stringify(loopHistory));
      window.location.replace(url);
    }

    // ── Handle email confirmation / OAuth PKCE code exchange ──
    // Note: Supabase SDK also auto-exchanges ?code= via detectSessionInUrl. If the SDK wins
    // the race, onAuthStateChange('SIGNED_IN') handles the redirect and this call returns an
    // error — we silently ignore it to avoid a false "Email confirmation failed" flash.
    const urlSearchParams = new URLSearchParams(window.location.search);
    const confirmCode = urlSearchParams.get('code');
    if (confirmCode) {
      sbClient.auth.exchangeCodeForSession(confirmCode).then(async ({ data, error }) => {
        if (!error && data.session) {
          localStorage.setItem('vaultproof_token', data.session.access_token);
          localStorage.setItem('vaultproof_user', JSON.stringify({
            id: data.user.id, email: data.user.email
          }));
          await redeemPendingPromo(data.session);
          safeRedirect('./');
        } else if (error && !isRedirecting) {
          // Delay so onAuthStateChange can redirect first if it handled the exchange
          setTimeout(function() {
            if (!isRedirecting) {
              var errEl = document.getElementById('authError');
              errEl.textContent = 'Email confirmation failed. Please try logging in with your email and password.';
              errEl.classList.remove('hidden');
            }
          }, 800);
        }
      }).catch(function() {});
    }

    // ── Check for CLI callback param ──
    const urlParams = new URLSearchParams(window.location.search);
    const rawCliCallback = urlParams.get('cli_callback');
    const cliState = urlParams.get('state');

    // Validate cli_callback: must be http/https on localhost/127.0.0.1 only
    let cliCallback = null;
    if (rawCliCallback) {
      try {
        const cbUrl = new URL(rawCliCallback);
        const safeProtocol = cbUrl.protocol === 'http:' || cbUrl.protocol === 'https:';
        const safeHost = cbUrl.hostname === 'localhost' || cbUrl.hostname === '127.0.0.1';
        if (safeProtocol && safeHost) {
          cliCallback = rawCliCallback;
        } else {
          console.warn('cli_callback rejected: must be http/https on localhost');
        }
      } catch {
        console.warn('cli_callback rejected: invalid URL');
      }
    }

    // ── Detect ?promo= param and store (clear stale promo if no param) ──
    const rawPromo = urlParams.get('promo');
    // Only accept alphanumeric + underscore/hyphen, max 50 chars
    const promoParam = rawPromo && /^[A-Z0-9_-]{1,50}$/i.test(rawPromo) ? rawPromo.toUpperCase() : null;
    // Pre-fill promo input if ?promo= is in URL (backwards compat)
    if (promoParam) {
      localStorage.setItem('vp_promo', promoParam);
      // Don't show promo UI during OAuth/email callback (?code= present) — avoids flash before redirect
      if (!confirmCode) {
        const input = document.getElementById('promoCodeInput');
        if (input) {
          input.value = promoParam;
          document.getElementById('promoRow').classList.remove('hidden');
          const msg = document.getElementById('promoCodeMsg');
          msg.textContent = 'Code saved \u2014 will be applied after you sign up.';
          msg.className = 'text-xs text-indigo-400 mt-1.5';
          msg.classList.remove('hidden');
        }
      }
    }

    function applyPromoCode() {
      const input = document.getElementById('promoCodeInput');
      const msg = document.getElementById('promoCodeMsg');
      const code = input.value.trim().toUpperCase();
      msg.classList.remove('hidden');
      if (!code) { msg.textContent = 'Enter a code first.'; msg.className = 'text-xs text-amber-400 mt-1.5'; return; }
      if (!/^[A-Z0-9_-]{1,50}$/.test(code)) { msg.textContent = 'Invalid code format.'; msg.className = 'text-xs text-amber-400 mt-1.5'; return; }
      // Check availability before saving
      fetch('https://api.vaultproof.dev/api/v1/promo/check/' + encodeURIComponent(code))
        .then(function(r) { return r.json(); })
        .then(function(d) {
          if (!d.valid || d.spotsLeft <= 0) {
            msg.textContent = 'This promo has ended \u2014 all spots claimed.';
            msg.className = 'text-xs text-amber-400 mt-1.5';
          } else {
            localStorage.setItem('vp_promo', code);
            msg.textContent = 'Code saved \u2014 will be applied after you sign up.';
            msg.className = 'text-xs text-indigo-400 mt-1.5';
          }
        })
        .catch(function() {
          // Save anyway if network check fails; redeem will validate server-side
          localStorage.setItem('vp_promo', code);
          msg.textContent = 'Code saved \u2014 will be applied after you sign up.';
          msg.className = 'text-xs text-indigo-400 mt-1.5';
        });
    }

    // Show CLI banner if logging in from CLI
    if (cliCallback) {
      const banner = document.createElement('div');
      banner.className = 'p-3 bg-indigo-500/10 border border-indigo-500/30 rounded-md text-sm text-indigo-400 mb-4 text-center';
      banner.textContent = 'Signing in from VaultProof CLI \u2014 log in below to connect.';
      const target = document.querySelector('.bg-card');
      if (target) target.prepend(banner);
    }

    // ── Auto-redeem promo helper (3s timeout to avoid blocking login) ──
    async function redeemPendingPromo(session) {
      const pendingPromo = localStorage.getItem('vp_promo');
      if (pendingPromo && session) {
        try {
          const controller = new AbortController();
          const timeout = setTimeout(function() { controller.abort(); }, 3000);
          const res = await fetch('https://api.vaultproof.dev/api/v1/promo/redeem', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + session.access_token },
            body: JSON.stringify({ code: pendingPromo }),
            signal: controller.signal,
          });
          clearTimeout(timeout);
          if (res.ok) localStorage.removeItem('vp_promo');
        } catch (e) { console.error('Promo redeem failed or timed out:', e); }
      }
    }

    // ── Check if already logged in (skip if handling code exchange or loop detected) ──
    if (!confirmCode && loopHistory.length < 3) {
      (async () => {
        const { data: { session } } = await sbClient.auth.getSession();
        if (session && !isRedirecting) {
          localStorage.setItem('vaultproof_token', session.access_token);
          localStorage.setItem('vaultproof_user', JSON.stringify({
            id: session.user.id,
            email: session.user.email
          }));

          // Auto-redeem promo before redirect
          await redeemPendingPromo(session);

          // If CLI callback, redirect to CLI with token
          if (cliCallback) {
            window.location.href = `${cliCallback}?token=${session.access_token}&refresh_token=${encodeURIComponent(session.refresh_token)}&email=${encodeURIComponent(session.user.email)}&state=${encodeURIComponent(cliState || '')}`;
            return;
          }

          safeRedirect('./');
        }
      })();
    }

    // ── Listen for auth state changes (handles OAuth callback) ──
    sbClient.auth.onAuthStateChange(async (event, session) => {
      if (event === 'SIGNED_IN' && session && !isRedirecting) {
        localStorage.setItem('vaultproof_token', session.access_token);
        localStorage.setItem('vaultproof_user', JSON.stringify({
          id: session.user.id,
          email: session.user.email
        }));

        // Auto-redeem promo before redirect
        await redeemPendingPromo(session);

        // If CLI callback, redirect to CLI with token
        if (cliCallback) {
          window.location.href = `${cliCallback}?token=${session.access_token}&refresh_token=${encodeURIComponent(session.refresh_token)}&email=${encodeURIComponent(session.user.email)}&state=${encodeURIComponent(cliState || '')}`;
          return;
        }

        safeRedirect('./');
      }
    });

    // ── GitHub OAuth ──
    async function loginWithGitHub() {
      // Preserve CLI callback and promo params through OAuth redirect
      const promoSuffix = localStorage.getItem('vp_promo') ? `&promo=${localStorage.getItem('vp_promo')}` : '';
      const redirectUrl = cliCallback
        ? `${window.location.origin}/app/login?cli_callback=${encodeURIComponent(cliCallback)}&state=${encodeURIComponent(cliState || '')}${promoSuffix}`
        : `${window.location.origin}/app/login${promoSuffix ? '?' + promoSuffix.slice(1) : ''}`;
      const { error } = await sbClient.auth.signInWithOAuth({
        provider: 'github',
        options: { redirectTo: redirectUrl }
      });
      if (error) showError(error.message);
    }

    // ── Google OAuth ──
    async function loginWithGoogle() {
      // Preserve CLI callback and promo params through OAuth redirect
      const promoSuffix = localStorage.getItem('vp_promo') ? `&promo=${localStorage.getItem('vp_promo')}` : '';
      const redirectUrl = cliCallback
        ? `${window.location.origin}/app/login?cli_callback=${encodeURIComponent(cliCallback)}&state=${encodeURIComponent(cliState || '')}${promoSuffix}`
        : `${window.location.origin}/app/login${promoSuffix ? '?' + promoSuffix.slice(1) : ''}`;
      const { error } = await sbClient.auth.signInWithOAuth({
        provider: 'google',
        options: { redirectTo: redirectUrl }
      });
      if (error) showError(error.message);
    }

    // ── UI helpers ──
    function showError(msg) {
      const el = document.getElementById('authError');
      el.textContent = msg;
      el.classList.remove('hidden');
    }

    function toggleEmailSection() {
      const section = document.getElementById('emailSection');
      const toggle = document.getElementById('emailToggle');
      const isHidden = section.classList.toggle('hidden');
      toggle.innerHTML = isHidden
        ? 'Or sign in with email &#9662;'
        : 'Or sign in with email &#9652;';
    }

    function showTab(tab) {
      document.getElementById('loginForm').classList.toggle('hidden', tab !== 'login');
      document.getElementById('registerForm').classList.toggle('hidden', tab !== 'register');
      document.getElementById('loginTab').className = tab === 'login'
        ? 'flex-1 py-2.5 text-sm font-medium rounded-md bg-brand text-white transition-all duration-200'
        : 'flex-1 py-2.5 text-sm font-medium rounded-md text-gray-400 hover:text-gray-300 transition-all duration-200';
      document.getElementById('registerTab').className = tab === 'register'
        ? 'flex-1 py-2.5 text-sm font-medium rounded-md bg-brand text-white transition-all duration-200'
        : 'flex-1 py-2.5 text-sm font-medium rounded-md text-gray-400 hover:text-gray-300 transition-all duration-200';
    }

    // ── Email/Password login via Supabase ──
    async function handleLogin(e) {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      const errEl = document.getElementById('loginError');
      errEl.classList.add('hidden');
      btn.textContent = 'Logging in...';
      btn.disabled = true;

      try {
        const { data, error } = await sbClient.auth.signInWithPassword({
          email: document.getElementById('loginEmail').value,
          password: document.getElementById('loginPassword').value,
        });
        if (error) throw error;

        localStorage.setItem('vaultproof_token', data.session.access_token);
        localStorage.setItem('vaultproof_user', JSON.stringify({
          id: data.user.id,
          email: data.user.email
        }));

        // Auto-redeem promo before redirect
        await redeemPendingPromo(data.session);

        // If CLI callback, redirect to CLI with token
        if (cliCallback) {
          window.location.href = `${cliCallback}?token=${data.session.access_token}&refresh_token=${encodeURIComponent(data.session.refresh_token)}&email=${encodeURIComponent(data.user.email)}`;
          return;
        }

        safeRedirect('./');
      } catch (err) {
        errEl.innerHTML = err.message;
        if (err.message.toLowerCase().includes('not confirmed')) {
          errEl.innerHTML += '<br><button onclick="resendConfirmation()" class="mt-2 text-indigo-400 hover:underline text-xs">Resend confirmation email</button>';
        }
        errEl.classList.remove('hidden');
      } finally {
        btn.textContent = 'Login';
        btn.disabled = false;
      }
    }

    async function resendConfirmation() {
      const email = document.getElementById('loginEmail').value;
      if (!email) return;
      const { error } = await sbClient.auth.resend({ type: 'signup', email, options: { emailRedirectTo: window.location.origin + '/app/login' } });
      const errEl = document.getElementById('loginError');
      if (error) {
        errEl.textContent = error.message;
      } else {
        errEl.innerHTML = 'Confirmation email resent! Check your inbox.';
        errEl.classList.remove('text-amber-400', 'bg-amber-500/10', 'border-amber-500/30');
        errEl.classList.add('text-green-400', 'bg-green-500/10', 'border-green-500/30');
      }
    }

    // ── Password Reset ──
    function showResetForm() {
      document.getElementById('loginForm').classList.add('hidden');
      document.getElementById('resetForm').classList.remove('hidden');
    }

    function hideResetForm() {
      document.getElementById('resetForm').classList.add('hidden');
      document.getElementById('loginForm').classList.remove('hidden');
    }

    async function handleReset() {
      const email = document.getElementById('resetEmail').value;
      const btn = document.getElementById('resetBtn');
      const status = document.getElementById('resetStatus');

      btn.textContent = 'Sending...';
      btn.disabled = true;

      const { error } = await sbClient.auth.resetPasswordForEmail(email, {
        redirectTo: window.location.origin + '/app/login'
      });

      status.classList.remove('hidden');
      if (error) {
        status.className = 'p-3 rounded-md text-sm bg-amber-500/10 border border-amber-500/30 text-amber-400';
        status.textContent = error.message;
      } else {
        status.className = 'p-3 rounded-md text-sm bg-indigo-500/10 border border-indigo-500/30 text-indigo-400';
        status.textContent = 'Reset link sent! Check your email.';
      }

      btn.textContent = 'Send Reset Link';
      btn.disabled = false;
    }

    // ── Email/Password register via Supabase ──
    async function handleRegister(e) {
      e.preventDefault();
      const btn = document.getElementById('regBtn');
      const errEl = document.getElementById('regError');
      errEl.classList.add('hidden');
      btn.textContent = 'Creating account...';
      btn.disabled = true;

      try {
        const { data, error } = await sbClient.auth.signUp({
          email: document.getElementById('regEmail').value,
          password: document.getElementById('regPassword').value,
          options: { emailRedirectTo: window.location.origin + '/app/login' },
        });
        if (error) throw error;

        if (data.session) {
          localStorage.setItem('vaultproof_token', data.session.access_token);
          localStorage.setItem('vaultproof_user', JSON.stringify({
            id: data.user.id,
            email: data.user.email
          }));

          // Auto-redeem promo before redirect
          await redeemPendingPromo(data.session);

          // If CLI callback, redirect to CLI with token
          if (cliCallback) {
            window.location.href = `${cliCallback}?token=${data.session.access_token}&refresh_token=${encodeURIComponent(data.session.refresh_token)}&email=${encodeURIComponent(data.user.email)}`;
            return;
          }

          safeRedirect('./');
        } else {
          // Email confirmation required
          errEl.textContent = 'Check your email to confirm your account.';
          errEl.classList.remove('hidden');
          errEl.classList.remove('text-amber-400', 'bg-amber-500/10', 'border-amber-500/30');
          errEl.classList.add('text-green-400', 'bg-green-500/10', 'border-green-500/30');
        }
      } catch (err) {
        errEl.textContent = err.message;
        errEl.classList.remove('hidden');
      } finally {
        btn.textContent = 'Create Account';
        btn.disabled = false;
      }
    }
  </script>
<!-- Analytics -->
<script>
(function(){
  var sid = localStorage.getItem('vp_sid');
  if (!sid) { sid = Math.random().toString(36).slice(2) + Date.now().toString(36); localStorage.setItem('vp_sid', sid); }
  var ref = document.referrer ? new URL(document.referrer).hostname : null;
  if (ref === location.hostname) ref = null;
  fetch('https://api.vaultproof.dev/analytics/event', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ type: 'pageview', page: location.pathname, referrer: ref, sessionId: sid }),
  }).catch(function(){});
})();
</script>
