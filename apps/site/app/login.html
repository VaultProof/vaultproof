<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | VaultProof</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace']
          },
          colors: {
            brand: '#6366f1',
            'brand-hover': '#5558e6',
            cyan: '#06b6d4',
            surface: '#0a0a0f',
            card: '#111118',
            border: '#1e1e2e'
          }
        }
      }
    };
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: #0a0a0f; margin: 0; }

    /* Animated gradient orbs */
    @keyframes drift1 {
      0%   { transform: translate(0, 0) scale(1); }
      25%  { transform: translate(60px, -40px) scale(1.1); }
      50%  { transform: translate(-30px, 50px) scale(0.95); }
      75%  { transform: translate(-60px, -20px) scale(1.05); }
      100% { transform: translate(0, 0) scale(1); }
    }
    @keyframes drift2 {
      0%   { transform: translate(0, 0) scale(1); }
      25%  { transform: translate(-50px, 30px) scale(1.08); }
      50%  { transform: translate(40px, -60px) scale(0.92); }
      75%  { transform: translate(30px, 40px) scale(1.05); }
      100% { transform: translate(0, 0) scale(1); }
    }
    .orb-1 {
      position: fixed;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(99,102,241,0.15) 0%, transparent 70%);
      top: -100px;
      right: -100px;
      animation: drift1 20s ease-in-out infinite;
      pointer-events: none;
      z-index: 0;
    }
    .orb-2 {
      position: fixed;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(99,102,241,0.12) 0%, transparent 70%);
      bottom: -80px;
      left: -80px;
      animation: drift2 25s ease-in-out infinite;
      pointer-events: none;
      z-index: 0;
    }

    .btn-glow {
      box-shadow: 0 0 20px rgba(99,102,241,0.3);
    }
    .btn-glow:hover {
      box-shadow: 0 0 30px rgba(99,102,241,0.4);
    }
  </style>
</head>
<body class="min-h-screen text-gray-200 flex items-center justify-center">

  <!-- Animated orbs -->
  <div class="orb-1"></div>
  <div class="orb-2"></div>

  <div class="w-full max-w-md px-6 relative z-10">

    <!-- Header -->
    <div class="text-center mb-8">
      <h1 class="text-2xl font-bold text-white tracking-tight" style="font-family:'Space Grotesk',sans-serif">VaultProof</h1>
      <p class="text-sm text-gray-500 mt-1">Zero-knowledge API key infrastructure</p>
    </div>

    <!-- Card -->
    <div class="bg-card border border-border rounded-2xl p-6">

      <!-- Error display -->
      <div id="authError" class="hidden p-3 bg-red-500/10 border border-red-500/30 rounded-xl text-sm text-red-400 mb-4"></div>

      <!-- GitHub OAuth button (primary) -->
      <button onclick="loginWithGitHub()" class="w-full flex items-center justify-center gap-3 bg-brand hover:bg-brand-hover text-white py-3 rounded-xl font-medium text-sm transition-all duration-200 btn-glow mb-3">
        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>
        Continue with GitHub
      </button>

      <!-- Google OAuth button (disabled / coming soon) -->
      <button disabled class="w-full flex items-center justify-center gap-3 bg-transparent border border-[#1e1e2e] text-gray-500 py-3 rounded-xl font-medium text-sm cursor-not-allowed mb-6 opacity-50">
        <svg class="w-5 h-5" viewBox="0 0 24 24"><path fill="#888" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="#777" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#666" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#555" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
        Continue with Google
        <span class="text-xs text-gray-600 ml-1">(Coming soon)</span>
      </button>

      <!-- Divider -->
      <div class="relative mb-5">
        <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-[#1e1e2e]"></div></div>
        <div class="relative flex justify-center">
          <span class="bg-card px-3 text-xs text-gray-500">Or sign in with email</span>
        </div>
      </div>

      <!-- Email/password section (always visible) -->
      <div id="emailSection">

        <!-- Tab Toggle -->
        <div class="flex bg-[#0a0a0f] rounded-xl p-1 mb-6">
          <button id="loginTab" onclick="showTab('login')" class="flex-1 py-2.5 text-sm font-medium rounded-xl bg-brand text-white transition-all duration-200">Login</button>
          <button id="registerTab" onclick="showTab('register')" class="flex-1 py-2.5 text-sm font-medium rounded-xl text-gray-400 hover:text-gray-300 transition-all duration-200">Register</button>
        </div>

        <!-- Login Form -->
        <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
          <div>
            <label class="block text-sm text-gray-400 mb-1.5">Email</label>
            <input type="email" id="loginEmail" required class="w-full bg-[#111118] border border-[#1e1e2e] rounded-xl px-4 py-2.5 text-sm text-white placeholder-gray-600 focus:border-[#6366f1] focus:outline-none transition" placeholder="you@example.com" />
          </div>
          <div>
            <label class="block text-sm text-gray-400 mb-1.5">Password</label>
            <input type="password" id="loginPassword" required class="w-full bg-[#111118] border border-[#1e1e2e] rounded-xl px-4 py-2.5 text-sm text-white placeholder-gray-600 focus:border-[#6366f1] focus:outline-none transition" placeholder="Enter your password" />
          </div>
          <div id="loginError" class="hidden p-3 bg-red-500/10 border border-red-500/30 rounded-xl text-sm text-red-400"></div>
          <button type="submit" id="loginBtn" class="w-full bg-brand hover:bg-brand-hover text-white py-2.5 rounded-xl font-medium text-sm transition-all duration-200 btn-glow">Login</button>
        </form>

        <!-- Register Form -->
        <form id="registerForm" class="hidden space-y-4" onsubmit="handleRegister(event)">
          <div>
            <label class="block text-sm text-gray-400 mb-1.5">Email</label>
            <input type="email" id="regEmail" required class="w-full bg-[#111118] border border-[#1e1e2e] rounded-xl px-4 py-2.5 text-sm text-white placeholder-gray-600 focus:border-[#6366f1] focus:outline-none transition" placeholder="you@example.com" />
          </div>
          <div>
            <label class="block text-sm text-gray-400 mb-1.5">Password</label>
            <input type="password" id="regPassword" required minlength="8" class="w-full bg-[#111118] border border-[#1e1e2e] rounded-xl px-4 py-2.5 text-sm text-white placeholder-gray-600 focus:border-[#6366f1] focus:outline-none transition" placeholder="Min 8 characters" />
          </div>
          <div id="regError" class="hidden p-3 bg-red-500/10 border border-red-500/30 rounded-xl text-sm text-red-400"></div>
          <button type="submit" id="regBtn" class="w-full bg-brand hover:bg-brand-hover text-white py-2.5 rounded-xl font-medium text-sm transition-all duration-200 btn-glow">Create Account</button>
        </form>
      </div>

      <!-- Legal consent -->
      <p class="text-xs text-gray-500 mt-5 text-center">By signing up, you agree to our <a href="/terms" class="text-indigo-400 hover:underline">Terms of Service</a> and <a href="/privacy" class="text-indigo-400 hover:underline">Privacy Policy</a>.</p>
    </div>

    <!-- Back link -->
    <p class="text-center text-xs text-gray-600 mt-6">
      <a href="/" class="hover:text-gray-400 transition">&larr; Back to VaultProof</a>
    </p>
  </div>

  <script>
    // ── Supabase client ──
    const supabase = window.supabase.createClient(
      'https://gwzkjiomemjlhtrdrlan.supabase.co',
      'sb_publishable_5oIbyPiiGAeGhH_-E7MmSQ_xkehUhY4'
    );

    // ── Check if already logged in ──
    (async () => {
      const { data: { session } } = await supabase.auth.getSession();
      if (session) {
        localStorage.setItem('vaultproof_token', session.access_token);
        localStorage.setItem('vaultproof_user', JSON.stringify({
          id: session.user.id,
          email: session.user.email
        }));
        window.location.href = './';
      }
    })();

    // ── Listen for auth state changes (handles OAuth callback) ──
    supabase.auth.onAuthStateChange((event, session) => {
      if (event === 'SIGNED_IN' && session) {
        localStorage.setItem('vaultproof_token', session.access_token);
        localStorage.setItem('vaultproof_user', JSON.stringify({
          id: session.user.id,
          email: session.user.email
        }));
        window.location.href = './';
      }
    });

    // ── GitHub OAuth ──
    async function loginWithGitHub() {
      const { error } = await supabase.auth.signInWithOAuth({
        provider: 'github',
        options: { redirectTo: window.location.origin + '/app/login' }
      });
      if (error) showError(error.message);
    }

    // ── UI helpers ──
    function showError(msg) {
      const el = document.getElementById('authError');
      el.textContent = msg;
      el.classList.remove('hidden');
    }

    function toggleEmailSection() {
      const section = document.getElementById('emailSection');
      const toggle = document.getElementById('emailToggle');
      const isHidden = section.classList.toggle('hidden');
      toggle.innerHTML = isHidden
        ? 'Or sign in with email &#9662;'
        : 'Or sign in with email &#9652;';
    }

    function showTab(tab) {
      document.getElementById('loginForm').classList.toggle('hidden', tab !== 'login');
      document.getElementById('registerForm').classList.toggle('hidden', tab !== 'register');
      document.getElementById('loginTab').className = tab === 'login'
        ? 'flex-1 py-2.5 text-sm font-medium rounded-xl bg-brand text-white transition-all duration-200'
        : 'flex-1 py-2.5 text-sm font-medium rounded-xl text-gray-400 hover:text-gray-300 transition-all duration-200';
      document.getElementById('registerTab').className = tab === 'register'
        ? 'flex-1 py-2.5 text-sm font-medium rounded-xl bg-brand text-white transition-all duration-200'
        : 'flex-1 py-2.5 text-sm font-medium rounded-xl text-gray-400 hover:text-gray-300 transition-all duration-200';
    }

    // ── Email/Password login via Supabase ──
    async function handleLogin(e) {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      const errEl = document.getElementById('loginError');
      errEl.classList.add('hidden');
      btn.textContent = 'Logging in...';
      btn.disabled = true;

      try {
        const { data, error } = await supabase.auth.signInWithPassword({
          email: document.getElementById('loginEmail').value,
          password: document.getElementById('loginPassword').value,
        });
        if (error) throw error;

        localStorage.setItem('vaultproof_token', data.session.access_token);
        localStorage.setItem('vaultproof_user', JSON.stringify({
          id: data.user.id,
          email: data.user.email
        }));
        window.location.href = './';
      } catch (err) {
        errEl.textContent = err.message;
        errEl.classList.remove('hidden');
      } finally {
        btn.textContent = 'Login';
        btn.disabled = false;
      }
    }

    // ── Email/Password register via Supabase ──
    async function handleRegister(e) {
      e.preventDefault();
      const btn = document.getElementById('regBtn');
      const errEl = document.getElementById('regError');
      errEl.classList.add('hidden');
      btn.textContent = 'Creating account...';
      btn.disabled = true;

      try {
        const { data, error } = await supabase.auth.signUp({
          email: document.getElementById('regEmail').value,
          password: document.getElementById('regPassword').value,
        });
        if (error) throw error;

        if (data.session) {
          localStorage.setItem('vaultproof_token', data.session.access_token);
          localStorage.setItem('vaultproof_user', JSON.stringify({
            id: data.user.id,
            email: data.user.email
          }));
          window.location.href = './';
        } else {
          // Email confirmation required
          errEl.textContent = 'Check your email to confirm your account.';
          errEl.classList.remove('hidden');
          errEl.classList.remove('text-red-400', 'bg-red-500/10', 'border-red-500/30');
          errEl.classList.add('text-green-400', 'bg-green-500/10', 'border-green-500/30');
        }
      } catch (err) {
        errEl.textContent = err.message;
        errEl.classList.remove('hidden');
      } finally {
        btn.textContent = 'Create Account';
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
