<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>VaultProof Admin</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="stylesheet" href="/css/site-theme.css">
  <style>
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: #05070d;
      color: #e5e7eb;
      font-family: Inter, system-ui, sans-serif;
    }
    main {
      width: min(440px, calc(100vw - 32px));
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 24px;
      background: rgba(15,23,42,.72);
      padding: 32px;
      box-shadow: 0 24px 80px rgba(0,0,0,.38);
    }
    h1 { margin: 0 0 12px; font-size: 24px; }
    p { margin: 0; color: #94a3b8; line-height: 1.7; }
    a { color: #a7f3d0; }
  </style>
</head>
<body>
  <main>
    <h1>Admin route moved</h1>
    <p>Use the root VaultProof admin boundary for B2C and staff operations. Enterprise customer workspaces stay on enterprise.vaultproof.dev.</p>
    <p style="margin-top:16px"><a href="/admin">Go to VaultProof Admin</a></p>
  </main>
</body>
</html>
